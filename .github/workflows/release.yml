name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build every
# platform binary, publish the npm packages, and create a GitHub release.
# Run manually with "dry run" checked to rehearse without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack everything but skip npm publish and the GitHub release
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # ring compiles C/assembly; point cc-rs at musl-gcc for this target.
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: ./target/${{ matrix.target }}/release/snapsort --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/snapsort${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 bundles npm 10, which can't use trusted publishing.
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble npm packages
        run: |
          expect=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then expect=(--expect-version "${GITHUB_REF_NAME#v}"); fi
          node scripts/npm/assemble.mjs --artifacts artifacts --out dist/npm --pack "${expect[@]}"

      - name: Check trusted publishing
        if: env.DRY_RUN == 'true'
        run: |
          # A dry run uploads nothing, so it can't show whether npm accepts this
          # workflow. Ask npm for each package's publish token the way
          # `npm publish` does, and warn where no trusted publisher matches.
          id_token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          for dir in dist/npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            response=$(curl -sS -X POST -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}")
            if jq -e .token > /dev/null 2>&1 <<< "$response"; then
              echo "$name: trusted publishing is set up"
            else
              echo "::warning::$name: no trusted publisher on npmjs.com matches this workflow ($(jq -r '.message // "no details"' 2>/dev/null <<< "$response"))"
            fi
          done

      - name: Publish to npm
        run: |
          # npm signs in with a short-lived token from the trusted publisher set up
          # for each package on npmjs.com, and adds provenance on public repositories.
          if ! printf '%s\n' 11.5.1 "$(npm --version)" | sort -V -C; then
            echo "::error::Trusted publishing needs npm 11.5.1 or later; found $(npm --version)"
            exit 1
          fi
          flags=(--access public)
          if [[ "$DRY_RUN" == "true" ]]; then flags+=(--dry-run); fi

          publish() {
            local dir="$1" name version status
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # Look up this one version: the registry caches whole-package lookups
            # (`npm view`) for up to 5 minutes, so checking a package that didn't
            # exist yet kept it showing as missing after its first publish.
            status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
              "https://registry.npmjs.org/${name/\//%2f}/$version")
            case "$status" in
              200) echo "::notice::$name@$version is already published; skipping"; return ;;
              404) ;;
              *) echo "::error::npm registry returned HTTP $status for $name@$version"; exit 1 ;;
            esac
            local tag=()
            if [[ "$version" == *-* ]]; then tag=(--tag next); fi
            npm publish "$dir" "${flags[@]}" "${tag[@]}"
          }

          # Platform packages first so the launcher never points at missing versions.
          for dir in dist/npm/*/; do
            [[ "$(basename "$dir")" == "snapsort" ]] || publish "${dir%/}"
          done
          publish dist/npm/snapsort

      - name: Create GitHub release
        if: github.ref_type == 'tag' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            target=$(basename "$dir")
            if [[ -f "$dir/snapsort.exe" ]]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/release/snapsort-$GITHUB_REF_NAME-$target.zip" snapsort.exe)
            else
              chmod +x "$dir/snapsort"
              tar -C "$dir" -czf "release/snapsort-$GITHUB_REF_NAME-$target.tar.gz" snapsort
            fi
          done
          (cd release && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
